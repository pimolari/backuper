<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workspace - Backuper</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Premium Light Stylesheet -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
</head>
<body>

    <!-- ===== Full-Width Top Bar (always visible, above everything) ===== -->
    <header class="app-header" id="app-header">
        <div class="header-left">
            <button id="sidebar-toggle-btn" title="Toggle Sidebar">
                <i class="fa-solid fa-bars"></i>
            </button>
            <div class="app-brand">
                <i class="fa-solid fa-cloud-arrow-up"></i>
                <span>backuper</span>
            </div>
        </div>

        <div class="header-center">
            <div class="search-box">
                <input type="text" id="search-input" class="search-input" placeholder="Search files...">
                <i class="fa-solid fa-magnifying-glass"></i>
            </div>
        </div>

        <div class="header-right">
            <div class="bucket-badge" id="header-bucket-badge" title="Select Bucket">
                <i class="fa-solid fa-bucket"></i>
                <span id="active-bucket-name" class="bucket-name-text">loading...</span>
                <i class="fa-solid fa-chevron-down" style="font-size: 0.7rem; margin-left: 6px; opacity: 0.7;"></i>
            </div>
            <!-- Clean Avatar -->
            <div class="user-profile-btn" id="open-profile-btn" title="Profile Settings">
                <div class="avatar" id="user-avatar">U</div>
            </div>
        </div>
    </header>

    <!-- ===== Below-header body: sidebar + main content ===== -->
    <div class="app-body" id="app-container">

        <!-- Sidebar (slides in/out below the header) -->
        <aside class="sidebar" id="app-sidebar">
            <div class="tree-title">
                <span>Folders</span>
                <i class="fa-solid fa-folder-plus" id="sidebar-new-folder-btn" title="Create New Folder"></i>
            </div>

            <!-- Scrollable Recursive Folder Tree -->
            <div class="folder-tree" id="folder-tree">
                <!-- Javascript will populate folder structure here -->
            </div>

            <button id="logout-btn" class="btn-secondary" style="width: 100%; margin-top: auto;">
                <i class="fa-solid fa-right-from-bracket"></i>
                <span>Log Out</span>
            </button>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <!-- Workspace Section -->
            <section class="workspace">
                <!-- Top Control Bar (Breadcrumbs & Actions) -->
                <div class="workspace-controls">
                    <!-- Path Breadcrumbs -->
                    <div class="breadcrumbs" id="breadcrumbs">
                        <span class="breadcrumb-item active">Root</span>
                    </div>

                    <!-- Selection & View Controls -->
                    <div class="view-controls">
                        <!-- Bulk Actions Toolbar (Hidden initially) -->
                        <div id="selection-toolbar" style="display: none; align-items: center; gap: 8px;">
                            <label class="custom-checkbox" style="margin-right: 8px;">
                                <input type="checkbox" id="select-all-checkbox">
                                <span class="checkmark"></span>
                                <span style="font-size: 0.85rem; margin-left: 4px;">All</span>
                            </label>
                            <span id="selection-count" style="font-size: 0.85rem; font-weight: 500; margin-right: 8px;">0 selected</span>
                            <button id="bulk-delete-btn" class="btn-danger" style="padding: 4px 10px; font-size: 0.8rem;">
                                <i class="fa-solid fa-trash"></i> Delete
                            </button>
                            <button id="clear-selection-btn" class="btn-secondary" style="padding: 4px 10px; font-size: 0.8rem; border: none; box-shadow: none;">
                                Clear
                            </button>
                        </div>
                        
                        <button id="sync-cache-btn" class="btn-secondary" title="Sync Cache from GCS">
                            <i class="fa-solid fa-arrows-rotate"></i>
                            <span class="desktop-only">Sync Cache</span>
                        </button>
                        <div class="view-toggle">
                            <button id="view-list-btn" class="toggle-btn active" title="List View">
                                <i class="fa-solid fa-list"></i>
                            </button>
                            <button id="view-grid-btn" class="toggle-btn" title="Preview Cards">
                                <i class="fa-solid fa-table-cells-large"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Drag and Drop Upload Zone -->
                <div class="upload-dropzone" id="upload-zone">
                    <input type="file" id="file-input" style="display: none;" multiple>
                    <i class="fa-solid fa-cloud-arrow-up"></i>
                    <h3>Drag &amp; Drop Files Here</h3>
                    <p>Or click to browse files</p>
                </div>

                <!-- Workspace Contents Container -->
                <div class="contents-container list-view" id="contents-container">
                    <!-- Populated dynamically via JS -->
                </div>

                <!-- Pagination Controls -->
                <div class="pagination-controls" id="pagination-controls">
                    <div class="page-size-selector" style="display: flex; align-items: center; gap: 8px;">
                        <label for="page-size-select" style="font-size: 0.85rem; color: var(--text-muted);">Per page:</label>
                        <select id="page-size-select" class="form-select" style="padding: 4px 8px; width: auto;">
                            <option value="10">10</option>
                            <option value="50">50</option>
                            <option value="200" selected>200</option>
                            <option value="1000">1000</option>
                        </select>
                    </div>
                    
                    <div class="page-navigation" style="display: flex; align-items: center; gap: 12px;">
                        <span id="pagination-info" style="font-size: 0.85rem; color: var(--text-muted);">Showing 0 of 0</span>
                        <div style="display: flex; gap: 8px;">
                            <button id="prev-page-btn" class="btn-secondary" style="padding: 6px 12px;" disabled>
                                <i class="fa-solid fa-chevron-left"></i>
                            </button>
                            <button id="next-page-btn" class="btn-secondary" style="padding: 6px 12px;" disabled>
                                <i class="fa-solid fa-chevron-right"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Viewer Modal -->
    <div class="modal-overlay" id="viewer-modal">
        <div class="modal-card">
            <div id="viewer-header">
                <span id="viewer-title">File Name</span>
                <i class="fa-solid fa-xmark modal-close" id="viewer-modal-close" style="position: static;"></i>
            </div>
            <div id="viewer-content">
                <button class="viewer-nav-btn" id="viewer-prev"><i class="fa-solid fa-chevron-left"></i></button>
                <div id="viewer-display"></div>
                <button class="viewer-nav-btn" id="viewer-next"><i class="fa-solid fa-chevron-right"></i></button>
            </div>
        </div>
    </div>

    <!-- User Profile Modal -->
    <div class="modal-overlay" id="profile-modal">
        <div class="modal-card">
            <i class="fa-solid fa-xmark modal-close" id="profile-modal-close"></i>
            <h2 class="modal-title">
                <i class="fa-solid fa-circle-user"></i>
                <span>User Profile &amp; Workspace</span>
            </h2>

            <form id="profile-form">
                <div class="form-group">
                    <label for="profile-name">Full Name</label>
                    <div class="input-container">
                        <input type="text" id="profile-name" class="form-input" required>
                        <i class="fa-solid fa-user"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label for="profile-email">Email Address</label>
                    <div class="input-container">
                        <input type="email" id="profile-email" class="form-input" required>
                        <i class="fa-solid fa-envelope"></i>
                    </div>
                </div>

                <button type="submit" class="btn-primary" style="margin-bottom: 24px;">
                    <i class="fa-solid fa-floppy-disk"></i>
                    <span>Save Changes</span>
                </button>
            </form>

            <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 24px 0;">

            <h3 style="font-size: 1.1rem; font-weight: 600; margin-bottom: 12px;">Storage Buckets</h3>
            <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 16px;">
                Manage your available buckets.
            </p>

            <div class="buckets-list" style="overflow-x: auto; overflow-y: auto; max-height: 150px; border: 1px solid var(--border-color); border-radius: 6px;">
                <table class="buckets-table" style="width: 100%; text-align: left; font-size: 0.9rem; border-collapse: collapse;">
                    <thead style="position: sticky; top: 0; background: var(--bg-surface);">
                        <tr style="border-bottom: 1px solid var(--border-color);">
                            <th style="padding: 8px 4px;">Name</th>
                            <th style="padding: 8px 4px;">Region</th>
                            <th style="padding: 8px 4px; text-align: right;">Action</th>
                        </tr>
                    </thead>
                    <tbody id="buckets-table-body">
                        <!-- Populated by JS -->
                    </tbody>
                </table>
            </div>

            <!-- Create New Bucket Area -->
            <div style="margin-top: 24px; padding: 16px; border-radius: 8px; background: #f9fafb; border: 1px solid var(--border-color);">
                <h4 style="font-size: 0.95rem; font-weight: 600; margin-bottom: 12px;">Add Bucket</h4>
                <form id="create-bucket-form" style="display: grid; grid-template-columns: 1fr 1fr auto; gap: 12px; align-items: flex-end;">
                    <div class="form-group" style="margin-bottom: 0;">
                        <label for="new-bucket-region" style="font-size: 0.75rem;">Region</label>
                        <select id="new-bucket-region" class="form-select">
                            <option value="europe-west1">europe-west1</option>
                            <option value="us-central1">us-central1</option>
                        </select>
                    </div>
                    <div class="form-group" style="margin-bottom: 0;">
                        <label for="new-bucket-class" style="font-size: 0.75rem;">Class</label>
                        <select id="new-bucket-class" class="form-select">
                            <option value="STANDARD">STANDARD</option>
                            <option value="NEARLINE">NEARLINE</option>
                        </select>
                    </div>
                    <button type="submit" class="btn-primary" style="padding: 10px 16px; width: auto;">
                        <i class="fa-solid fa-plus"></i>
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- Bucket Selector Dropdown Modal -->
    <div class="modal-overlay bucket-selector-overlay" id="bucket-selector-modal">
        <div class="modal-card" style="width: 350px; max-width: 90vw; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1);">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                <h3 style="font-size: 1rem; font-weight: 600;">Select Bucket</h3>
                <i class="fa-solid fa-xmark modal-close" id="bucket-modal-close" style="position: static;"></i>
            </div>
            <div id="quick-bucket-list" style="max-height: 300px; overflow-y: auto;">
                <!-- Populated by JS -->
            </div>
            <div style="margin-top: 12px; text-align: center;">
                <button class="btn-secondary" style="width: 100%; font-size: 0.85rem;" id="open-profile-from-bucket">Manage Buckets...</button>
            </div>
        </div>
    </div>

    <!-- Create Folder Modal -->
    <div class="modal-overlay" id="folder-modal">
        <div class="modal-card" style="max-width: 400px;">
            <i class="fa-solid fa-xmark modal-close" id="folder-modal-close"></i>
            <h2 class="modal-title">
                <i class="fa-solid fa-folder-plus"></i>
                <span>Create Folder</span>
            </h2>

            <form id="folder-form">
                <div class="form-group">
                    <label for="new-folder-name">Folder Name</label>
                    <div class="input-container">
                        <input type="text" id="new-folder-name" class="form-input" placeholder="e.g. Holidays 2026" required>
                        <i class="fa-solid fa-folder"></i>
                    </div>
                </div>

                <button type="submit" class="btn-primary">
                    <i class="fa-solid fa-check"></i>
                    <span>Create</span>
                </button>
            </form>
        </div>
    </div>

    <!-- Alert Toasts Container -->
    <div id="alert-container" class="alert-container"></div>

    <!-- Script Imports -->
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
